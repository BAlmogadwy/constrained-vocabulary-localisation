# Score-floor audit — COCO-unseen replication. Identical to coco_unseen_traditional.yaml
# except detector thresholds are ~0.001 (set in the detector Config defaults) and output
# goes to a SEPARATE root. Per-image candidate labels are the exact ones from the original
# cached run (reconstructed), so the ONLY variable vs. baseline is the confidence floor.
dataset:
  images_dir: data/raw/coco2017/val2017
  limit: null

labels:
  values:
    - microwave
    - oven
    - toaster
    - sink
    - refrigerator
    - book
    - clock
    - vase
    - scissors
    - teddy bear
    - hair drier
    - toothbrush
  per_image_file: data/processed/coco2017/val/coco_unseen_dynamic_labels.json

output:
  dir: results/raw/traditional_lowthr/coco2017_unseen

models:
  - name: yolo_world
    device: cuda:0
    strategy: default
    output_name: yolo_world_coco_unseen.json
  - name: grounding_dino
    device: cuda:0
    strategy: default
    output_name: grounding_dino_coco_unseen.json
  - name: owl_vit
    device: cuda:0
    strategy: default
    output_name: owl_vit_coco_unseen.json
