dataset:
  images_dir: data/subsets/lvis_v1_val_unseen/images
  limit: null

labels:
  per_image_file: data/processed/lvis_v1/val/lvis_unseen_dynamic_labels.json
  file: prompts/coco_unseen_labels.txt
  values: []

output:
  dir: results/visual_cot/lvis_unseen

models:
  - name: gpt-5
    prompt_strategy: single_query
    output_name: gpt5_visual_cot.json
  - name: claude-haiku-4-5
    prompt_strategy: single_query
    output_name: claude_visual_cot.json
  - name: gemini-2.5-flash
    prompt_strategy: single_query
    output_name: gemini_visual_cot.json
  - name: gemma-3-12b-it
    prompt_strategy: single_query
    output_name: gemma3_12b_visual_cot.json
  - name: Llama-3.2-11B-Vision-Instruct
    prompt_strategy: single_query
    output_name: llama_32_visual_cot.json
  - name: llava-v1.6-mistral-7b-hf
    prompt_strategy: single_query
    output_name: llava_v16_visual_cot.json
  - name: paligemma2-10b-mix-448
    prompt_strategy: single_query
    output_name: paligemma2_visual_cot.json
  - name: Qwen3-VL-8B-Instruct
    prompt_strategy: single_query
    output_name: qwen3_visual_cot.json

ablation:
  subset_cache: data/subsets/lvis/ablation_100_ids.json
  subset_size: 100
  subset_seed: 1337
  temperatures: [0.0, 0.2, 0.5]
  prompt_variants:
    baseline:
      prompt_strategy: single_query
    prompt_b:
      prompt_strategy: iterative

force: false
